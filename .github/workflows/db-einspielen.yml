# KC-CLUB-DB-EINSPIELEN (06.10.2026, Wunsch Hansi, Weg B): Datenbank-Migration nur von Hand starten („Run workflow“),
# weil die Bestätigung der Supabase-Verbindung in der Cloud-Sitzung nicht angezeigt wird. Gestartet wird nur nach Hansis „einspielen“.
# Der vorhandene Schlüssel darf nur Edge Functions hochladen (keine Datenbankrechte). Darum:
#   1. Vertragstests  2. Auftrag (Migration + Test) in die Funktion kc-db-einspielen schreiben und hochladen
#   3. Funktion mit GitHub-OIDC-Token aufrufen: Probelauf (immer zurückgerollt); nur bei Grün und modus=einspielen: einspielen + Nachprüfung
#   4. IMMER danach: Funktion mit leerem Auftrag neu hochladen (entschärft, antwortet dann 410)
# Modus „pruefen“ ändert an der Datenbank nie etwas.
name: Datenbank einspielen
on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migrationsdatei (Pfad im Repo)"
        required: true
      testdatei:
        description: "Testdatei für den Probelauf (leer = nur Einspielbarkeit prüfen)"
        required: false
        default: ""
      erwartet:
        description: "Datei mit erwarteten Zeilen im Testbericht (leer = keine)"
        required: false
        default: ""
      nachpruefung:
        description: "SQL, das nach dem Einspielen true liefern muss"
        required: false
        default: "select true"
      modus:
        description: "pruefen (nur Probelauf) oder einspielen"
        required: true
        default: "pruefen"
permissions:
  contents: read
  id-token: write
concurrency:
  group: db-einspielen
  cancel-in-progress: false
jobs:
  db:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJEKT: ptblnpiroqftcvlsrhac
      MIGRATION: ${{ inputs.migration }}
      TESTDATEI: ${{ inputs.testdatei }}
      ERWARTET: ${{ inputs.erwartet }}
      NACHPRUEFUNG: ${{ inputs.nachpruefung }}
      MODUS: ${{ inputs.modus }}
      AUFTRAG: supabase/functions/kc-db-einspielen/auftrag.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/app-vertrag.test.mjs
      - name: Eingaben prüfen
        run: |
          case "$MIGRATION" in supabase/migrations/*.sql) ;; *) echo "Nur Dateien aus supabase/migrations"; exit 1;; esac
          test -f "$MIGRATION"
          if [ -n "$TESTDATEI" ]; then case "$TESTDATEI" in tools/db-test/*.sql) test -f "$TESTDATEI";; *) echo "Testdatei nur aus tools/db-test"; exit 1;; esac; fi
          if [ -n "$ERWARTET" ]; then case "$ERWARTET" in tools/db-test/*) test -f "$ERWARTET";; *) exit 1;; esac; fi
          case "$MODUS" in pruefen|einspielen) ;; *) echo "modus: pruefen oder einspielen"; exit 1;; esac
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Auftrag schreiben und Funktion hochladen
        run: |
          cp "$AUFTRAG" /tmp/auftrag_leer.ts
          node -e '
            const fs = require("fs"), e = process.env;
            const a = { name: require("path").basename(e.MIGRATION, ".sql"), migration: fs.readFileSync(e.MIGRATION, "utf8"),
              test: e.TESTDATEI ? fs.readFileSync(e.TESTDATEI, "utf8") : "",
              erwartet: e.ERWARTET ? fs.readFileSync(e.ERWARTET, "utf8").split("\n").map((z) => z.trim()).filter(Boolean) : [],
              nachpruefung: e.NACHPRUEFUNG || "select true" };
            fs.writeFileSync(e.AUFTRAG, "export const AUFTRAG = " + JSON.stringify(a) + ";\n");'
          supabase functions deploy kc-db-einspielen --project-ref "$PROJEKT" --no-verify-jwt --use-api
      - name: Probelauf und (falls gewählt) Einspielen
        run: |
          sleep 15
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kc-db-einspielen" | jq -r .value)
          code=$(curl -sS -X POST "https://$PROJEKT.supabase.co/functions/v1/kc-db-einspielen" -H "Authorization: Bearer $token" \
            -H "content-type: application/json" -d "{\"modus\":\"$MODUS\"}" -o /tmp/antwort.json -w "%{http_code}")
          echo "HTTP $code"; jq . /tmp/antwort.json || cat /tmp/antwort.json
          [ "$code" = "200" ] || { echo "Nicht erfolgreich"; exit 1; }
          jq -e '.probelauf.ok == true' /tmp/antwort.json >/dev/null || exit 1
          if [ "$MODUS" = "einspielen" ]; then jq -e '.eingespielt == true and .nachpruefung == true' /tmp/antwort.json >/dev/null || exit 1; echo "Eingespielt und nachgeprüft"; else echo "Probelauf grün – nichts verändert"; fi
      - name: Funktion entschärfen (immer)
        if: ${{ always() }}
        run: |
          cp /tmp/auftrag_leer.ts "$AUFTRAG" 2>/dev/null || git checkout -- "$AUFTRAG"
          supabase functions deploy kc-db-einspielen --project-ref "$PROJEKT" --no-verify-jwt --use-api
          sleep 10
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://$PROJEKT.supabase.co/functions/v1/kc-db-einspielen" -d '{}')
          echo "Ohne Token: HTTP $code (erwartet 401)"; [ "$code" = "401" ]
