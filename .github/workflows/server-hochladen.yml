# KC-CLUB-SERVER-DEPLOY: lädt die Edge Function „kc-club“ automatisch zu Supabase hoch,
# sobald sich der Server-Code auf main ändert (oder per Hand über „Run workflow“).
# Schlüssel: Repository-Secret SUPABASE_ACCESS_TOKEN (nur Edge Functions lesen/schreiben, nur dieses Projekt,
# läuft Ende September 2027 ab – rechtzeitig erneuern). Kostenlos: GitHub Actions + Supabase CLI.
name: Server hochladen
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/kc-club/**"
  workflow_dispatch:
# 2.736.0 KC-CLUB-EINSPIELEN-FENSTER: id-token für die Meldung „wird gerade eingespielt“ (GitHub-signiert, kein Geheimnis)
permissions:
  contents: read
  id-token: write
concurrency:
  group: server-hochladen
  cancel-in-progress: false
jobs:
  hochladen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJEKT: ptblnpiroqftcvlsrhac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # KC-CLUB-RC-PRUEFUNG (20.10.2026): alle Tests – ein roter Test verhindert das Hochladen
      - run: for t in tests/*.test.mjs; do node "$t" || exit 1; done
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0
      - name: Wartungsfenster an
        run: tools/einspielen-melden.sh an 5
      - name: Edge Function hochladen
        run: supabase functions deploy kc-club --project-ref "$PROJEKT" --no-verify-jwt --use-api
      - name: Prüfen, ob die neue Server-Version antwortet
        run: |
          soll=$(grep -oP 'const SERVER_VERSION = "\K[^"]+' supabase/functions/kc-club/index.ts)
          for i in 1 2 3 4 5 6; do
            antwort=$(curl -s -X POST "https://$PROJEKT.supabase.co/functions/v1/kc-club" -H "content-type: application/json" -d '{"action":"version"}' || true)
            echo "Antwort: $antwort"
            # ohne Zugang antwortet der Server mit einer Fehlermeldung – Hauptsache, er läuft
            if echo "$antwort" | grep -q '"error"\|"ok"'; then echo "Server antwortet (Soll-Version $soll)"; exit 0; fi
            sleep 10
          done
          echo "Server antwortet nicht"; exit 1
      - name: Wartungsfenster aus
        if: always()
        run: tools/einspielen-melden.sh aus
