# KC-TERMINE-DEPLOY: lädt die Edge Function „kc-termine“ aus dem Repo Sire65/KC-Besuchsprotokoll zu Supabase hoch.
# Der Quellcode bleibt dort (eine Quelle); hier steht nur, WELCHER Stand hochgeladen wird (.github/deploy/kc-termine.ref),
# weil nur dieses Repo den Upload-Schlüssel (Secret SUPABASE_ACCESS_TOKEN, nur Edge Functions) hat. Kostenlos.
name: Termin-Programm hochladen
on:
  push:
    branches: [main]
    paths:
      - ".github/deploy/kc-termine.ref"
  workflow_dispatch:
concurrency:
  group: termine-hochladen
  cancel-in-progress: false
jobs:
  hochladen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJEKT: ptblnpiroqftcvlsrhac
    steps:
      - uses: actions/checkout@v4
      - name: Stand bestimmen
        id: stand
        run: |
          sha=$(grep -E '^[0-9a-f]{40}$' .github/deploy/kc-termine.ref | tail -1)
          test -n "$sha" || { echo "Kein Commit in kc-termine.ref"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Sire65/KC-Besuchsprotokoll
          ref: ${{ steps.stand.outputs.sha }}
          path: besuchsprotokoll
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # erst der Test – ein roter Test verhindert das Hochladen
      - run: node besuchsprotokoll/tests/termine-kennung.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Edge Function hochladen
        working-directory: besuchsprotokoll
        run: supabase functions deploy kc-termine --project-ref "$PROJEKT" --no-verify-jwt --use-api
      - name: Prüfen, ob kc-termine antwortet
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/antwort -w "%{http_code}" -X POST "https://$PROJEKT.supabase.co/functions/v1/kc-termine" -H "content-type: application/json" -d '{"action":"t_init"}' || true)
            echo "HTTP $code: $(head -c 200 /tmp/antwort)"
            # ohne Schlüssel antwortet die Funktion mit 401 – Hauptsache, sie läuft
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "kc-termine antwortet nicht"; exit 1
