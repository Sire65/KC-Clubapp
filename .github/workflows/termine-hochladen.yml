# KC-TERMINE-DEPLOY: lädt die Edge Function „kc-termine“ zu Supabase hoch.
# KC-TERMINE-UMZUG (2.28.0): Der Quellcode liegt jetzt HIER (supabase/functions/kc-termine) – eine Quelle, kein zweites Repo mehr.
# Bis 2.27 kam er aus Sire65/KC-Besuchsprotokoll über .github/deploy/kc-termine.ref (nur noch Historie). Kostenlos.
name: Termin-Programm hochladen
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/kc-termine/**"
  workflow_dispatch:
concurrency:
  group: termine-hochladen
  cancel-in-progress: false
jobs:
  hochladen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJEKT: ptblnpiroqftcvlsrhac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # erst der Test – ein roter Test verhindert das Hochladen
      - run: node tests/termine-kennung.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Edge Function hochladen
        run: supabase functions deploy kc-termine --project-ref "$PROJEKT" --no-verify-jwt --use-api
      - name: Prüfen, ob kc-termine antwortet
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/antwort -w "%{http_code}" -X POST "https://$PROJEKT.supabase.co/functions/v1/kc-termine" -H "content-type: application/json" -d '{"action":"t_init"}' || true)
            echo "HTTP $code: $(head -c 200 /tmp/antwort)"
            # ohne Schlüssel antwortet die Funktion mit 401 – Hauptsache, sie läuft
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "kc-termine antwortet nicht"; exit 1
