# KC-CLUB-PAGES-NACH-TESTS (RC 20.10.2026, Freigabe Hansi): die App geht erst live, wenn alle Tests grün sind.
# Vorher veröffentlichte GitHub Pages direkt vom Zweig – ein roter Test hielt nichts auf (AGENTS.md: „ein roter Test verhindert das Einspielen“).
# Wirksam erst, wenn in den Repository-Einstellungen unter Pages → „Build and deployment“ → Source „GitHub Actions“ gewählt ist.
# Gebaut wird wie bisher mit Jekyll (gleiches Ergebnis wie „pages-build-deployment“), nur eben nach den Tests.
name: Seite veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # ein roter Test verhindert das Veröffentlichen
      - run: for t in tests/*.test.mjs; do node "$t" || exit 1; done
  bauen:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 2.736.0 KC-CLUB-EINSPIELEN-FENSTER: wer die App genau jetzt startet, sieht „Kurze Wartung“ (nie ein Abbruch des Ablaufs)
      - name: Wartungsfenster an
        run: tools/einspielen-melden.sh an 5
      - id: seite
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Wartungsfenster aus
        if: always()
        run: sleep 20; tools/einspielen-melden.sh aus
