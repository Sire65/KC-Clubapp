# KC-CLUB-PAGES-NACH-TESTS (RC 20.10.2026, Freigabe Hansi): die App geht erst live, wenn alle Tests grün sind.
# Vorher veröffentlichte GitHub Pages direkt vom Zweig – ein roter Test hielt nichts auf (AGENTS.md: „ein roter Test verhindert das Einspielen“).
# Wirksam erst, wenn in den Repository-Einstellungen unter Pages → „Build and deployment“ → Source „GitHub Actions“ gewählt ist.
# Gebaut wird wie bisher mit Jekyll (gleiches Ergebnis wie „pages-build-deployment“), nur eben nach den Tests.
name: Seite veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      art:
        description: "termin (12/20 Uhr), hansi (Hansi hat „einspielen“ gesagt) oder notfall"
        default: "termin"
permissions:
  contents: read
  actions: read # KC-EINSPIELEN-ABSTAND: Zeitpunkt der letzten Version
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # ein roter Test verhindert das Veröffentlichen
      - run: for t in tests/*.test.mjs; do node "$t" || exit 1; done
  # 2.917.0 KC-CLUB-RUNDGANG-PFLICHT (Hansi 11.11.2026 „Ja, zur Pflicht machen“ – nach 80 grünen Läufen ohne Fehlalarm seit 04.11.):
  # der Klick-Rundgang im echten Browser (Testdaten, nichts nach draußen) muss grün sein, sonst bleibt die alte Version online.
  rundgang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/rundgang.browser.mjs
  bauen:
    needs: [tests, rundgang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # 2.822.0 KC-CLUB-ANLEITUNGEN-AUTO (Wunsch Hansi 02.11.2026 „die Anleitungen müssen sich bei Änderungen automatisch anpassen, mit Versionsnummer“):
      # bei jedem Veröffentlichen werden die eingebauten Anleitungs-PDFs aus den aktuellen Texten der App neu erzeugt – mit Datum und App-Version im Kopf.
      # Schlägt das fehl, gehen die zuletzt gespeicherten Blätter aus dem Repository raus (das Veröffentlichen wird nicht aufgehalten).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Anleitungen neu erzeugen
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/anleitungen-pdf.mjs
          rm -rf node_modules
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # KC-EINSPIELEN-SPERRE (04.11.2026): nur zum Termin 12/20 Uhr (oder Hansi sagt ausdrücklich „einspielen“), nicht während
      # Spiegelung/Sicherung, nicht wenn mehr als 2 in der App sind – geprüft direkt hier, kurz bevor die Version ankommt.
      - name: Termin und Ruhe abwarten
        env:
          GH_TOKEN: ${{ github.token }}
          NACHRICHT: ${{ github.event.head_commit.message }}
          EINGABE: ${{ inputs.art }}
          VORHER: ${{ github.event.before }}
        run: |
          art="${EINGABE:-termin}"
          # nur die erste Zeile (Titel) zählt – eine Erklärung im Text, die „[Notfall]“ nur erwähnt, ist kein Notfall (Fund 13.11.2026, 2.945.0)
          titel="${NACHRICHT%%$'\n'*}"
          case "$titel" in *"[Notfall]"*) art=notfall;; *"[Hansi: einspielen]"*) art=hansi;; esac
          neu=ja
          # nur wenn sich die App-Version ändert, starten die Apps neu (Werkzeuge/Doku gehen ohne Warten raus)
          if [ -n "$VORHER" ] && [ "$VORHER" != "0000000000000000000000000000000000000000" ] && git fetch -q --no-tags --depth=1 origin "$VORHER" 2>/dev/null; then
            git diff --quiet "$VORHER" HEAD -- version.json && neu=nein
          fi
          tools/einspielen-ruhe.sh "$art" "$neu"
      # 2.736.0 KC-CLUB-EINSPIELEN-FENSTER: wer die App genau jetzt startet, sieht „Kurze Wartung“ (nie ein Abbruch des Ablaufs)
      - name: Wartungsfenster an
        run: tools/einspielen-melden.sh an 5
      - id: seite
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Wartungsfenster aus
        if: always()
        run: sleep 20; tools/einspielen-melden.sh aus
