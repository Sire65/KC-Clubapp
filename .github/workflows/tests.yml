name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/app-vertrag.test.mjs
      - run: node tests/fra-verschluesselung.test.mjs
      - run: node tests/fra-teile.test.mjs
      - run: node tests/notfall-tresor.test.mjs
      - run: node tests/avatar-rueckwaerts.test.mjs
      - run: node tests/termine-kennung.test.mjs
      # KC-CLUB-RC-PRUEFUNG (20.10.2026): Prüfungen der RC-Vorbereitung
      - run: node tests/rc-server.test.mjs
      - run: node tests/rc-app.test.mjs
      # KC-SUPABASE-GRANTS (21.10.2026): neue Tabellen mit ausdrücklichen Rechten
      - run: node tests/migration-rechte.test.mjs
      # KC-CLUB-ANRUF-TURN (2.563.0): Umleitungs-Server für Anrufe
      - run: node tests/anruf-turn.test.mjs
      # KC-CLUB-ANKLOPFEN-VERPASST (2.567.0): verpasstes Anklopfen + Stand der Mitteilung
      - run: node tests/anklopfen-verpasst.test.mjs
      # KC-CLUB-ANRUFBEANTWORTER (2.568.0)
      - run: node tests/anrufbeantworter.test.mjs
      # KC-CLUB-FREMDZUGRIFF (2.579.0)
      - run: node tests/fremdzugriff.test.mjs
      - run: node tests/sicherheit.test.mjs
      # KC-CLUB-DIENST-STEMPEL (2.590.0)
      - run: node tests/dienst-stempel.test.mjs
      - run: node tests/dienst-tausch.test.mjs
      # KC-CLUB-RUNDER-TISCH (2.760.0)
      - run: node tests/runder-tisch.test.mjs
      # KC-CLUB-REZEPT-WEIHNACHT (2.729.0)
      - run: node tests/rezept-weihnacht.test.mjs
      # KC-CLUB-ONLINE-NAMEN (2.731.0)
      - run: node tests/online-namen.test.mjs
      # KC-CLUB-WUNSCH-ABHAKEN (2.757.0)
      - run: node tests/wunsch-abhaken.test.mjs
      # KICC-F-110 Spiegel-Zeitblöcke
      - run: node tests/spiegel-zeitbloecke.test.mjs
      # KC-CLUB-FILM-HINWEIS (2.738.0)
      - run: node tests/film-hinweis.test.mjs
      # KC-CLUB-EINLADUNG-AN, KC-CLUB-SAMMEL-ANSAGE (2.739.0)
      - run: node tests/einladung-an.test.mjs
      # KC-CLUB-EINLADUNG-BRIEF (2.740.0)
      - run: node tests/einladung-brief.test.mjs
      # KC-CLUB-AKTENTASCHE-FREIGEBEN, KC-CLUB-EINGANG-DURCHGEHEN, KC-CLUB-ZIELWAHL (2.741.0)
      - run: node tests/aktentasche-freigeben.test.mjs
      # KC-CLUB-ABLAGEKORB-EINGANG, KC-CLUB-EINGANG-WEITER (2.743.0)
      - run: node tests/ablagekorb-eingang.test.mjs
      - run: node tests/clubabend-anwesend.test.mjs
      - run: node tests/sitzung-schritte.test.mjs
      - run: node tests/sitzung-aufgaben.test.mjs
      - run: node tests/nachrichten-reihe.test.mjs
      - run: node tests/spur-voll.test.mjs
      - run: node tests/zugang-pruefen.test.mjs
      - run: node tests/geheimnis-waechter.test.mjs
      - run: node tests/neon-pruefung.test.mjs
      - run: node tests/tempo-versand.test.mjs
      - run: node tests/zugang-hilfe.test.mjs
      - run: node tests/spur-keepalive.test.mjs
      - run: node tests/schluessel-sichern.test.mjs
      - run: node tests/verlassen-erinnern.test.mjs
      - run: node tests/druck-seitenwechsel.test.mjs
      - run: node tests/buero-schnell.test.mjs
      - run: node tests/ml-alle-daten.test.mjs
      - run: node tests/neu-entwurf.test.mjs
      - run: node tests/vm-stier.test.mjs
      - run: node tests/fee-blase.test.mjs
      - run: node tests/kom-symbole.test.mjs
      - run: node tests/hilfe-passend.test.mjs
      - run: node tests/spur-wieder.test.mjs
      - run: node tests/einspielen-fenster.test.mjs
      - run: node tests/nt-gruss.test.mjs
      - run: node tests/ungelesen-admin.test.mjs
      - run: node tests/vorladen-foto.test.mjs
      # 2.725.0 KC-CLUB-TESTS-ALLE (Prüfbericht Etappe 5): fehlten in dieser Liste (beim Veröffentlichen liefen sie schon) – ein Wächter in
      # app-vertrag.test.mjs meldet künftig jeden tests/*.test.mjs, der hier nicht steht
      - run: node tests/anruf-besser.test.mjs
      - run: node tests/backup-verify-teile.test.mjs
      - run: node tests/rose.test.mjs
  # 2.725.0 KC-CLUB-RUNDGANG: Klick-Rundgang im echten Browser (Testdaten, nichts nach draußen) – Programmfehler und Schutzschild-Sperren werden rot
  rundgang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/rundgang.browser.mjs
