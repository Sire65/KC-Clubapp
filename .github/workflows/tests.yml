name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/app-vertrag.test.mjs
      - run: node tests/fra-verschluesselung.test.mjs
      - run: node tests/fra-teile.test.mjs
      - run: node tests/notfall-tresor.test.mjs
      - run: node tests/avatar-rueckwaerts.test.mjs
      - run: node tests/termine-kennung.test.mjs
      # KC-CLUB-RC-PRUEFUNG (20.10.2026): Prüfungen der RC-Vorbereitung
      - run: node tests/rc-server.test.mjs
      - run: node tests/rc-app.test.mjs
      # KC-SUPABASE-GRANTS (21.10.2026): neue Tabellen mit ausdrücklichen Rechten
      - run: node tests/migration-rechte.test.mjs
      # KC-CLUB-ANRUF-TURN (2.563.0): Umleitungs-Server für Anrufe
      - run: node tests/anruf-turn.test.mjs
      # KC-CLUB-ANKLOPFEN-VERPASST (2.567.0): verpasstes Anklopfen + Stand der Mitteilung
      - run: node tests/anklopfen-verpasst.test.mjs
      # KC-CLUB-ANRUFBEANTWORTER (2.568.0)
      - run: node tests/anrufbeantworter.test.mjs
      # KC-CLUB-FREMDZUGRIFF (2.579.0)
      - run: node tests/fremdzugriff.test.mjs
      # KC-CLUB-DIENST-STEMPEL (2.590.0)
      - run: node tests/dienst-stempel.test.mjs
      - run: node tests/dienst-tausch.test.mjs
      - run: node tests/zugang-pruefen.test.mjs
      - run: node tests/geheimnis-waechter.test.mjs
      - run: node tests/neon-pruefung.test.mjs
      - run: node tests/tempo-versand.test.mjs
      - run: node tests/zugang-hilfe.test.mjs
      - run: node tests/spur-keepalive.test.mjs
      - run: node tests/schluessel-sichern.test.mjs
      - run: node tests/verlassen-erinnern.test.mjs
      - run: node tests/druck-seitenwechsel.test.mjs
      - run: node tests/buero-schnell.test.mjs
      - run: node tests/ml-alle-daten.test.mjs
      - run: node tests/neu-entwurf.test.mjs
