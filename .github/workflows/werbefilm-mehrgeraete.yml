name: KC Werbefilm Tablet-PC-Hinweis

on:
  push:
    paths:
      - '.github/workflows/werbefilm-mehrgeraete.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  film-aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Aktuelle Club-App holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: FFmpeg und Schrift sicherstellen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Werbefilm gezielt ergaenzen
        shell: bash
        run: |
          set -euo pipefail
          QUELLE="film/werbefilm.mp4"
          ZIEL="film/werbefilm-mehrgeraete.tmp.mp4"
          test -s "$QUELLE"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$QUELLE" | grep -qx '1080,1920'
          LAENGE=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$QUELLE")
          awk -v d="$LAENGE" 'BEGIN { exit !(d > 129 && d < 134) }'
          SCHRIFT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          FILTER="drawbox=x=52:y=1523:w=976:h=350:color=0x741521@0.95:t=fill:enable='between(t,105.5,112.5)',drawbox=x=52:y=1523:w=976:h=350:color=0xF5C542@1:t=4:enable='between(t,105.5,112.5)',drawtext=fontfile=${SCHRIFT}:text='Die App kannst du parallel':fontcolor=white:fontsize=63:x=(w-text_w)/2:y=1562:enable='between(t,105.5,112.5)',drawtext=fontfile=${SCHRIFT}:text='auch auf deinem Tablet und PC':fontcolor=white:fontsize=55:x=(w-text_w)/2:y=1655:enable='between(t,105.5,112.5)',drawtext=fontfile=${SCHRIFT}:text='installieren.':fontcolor=white:fontsize=63:x=(w-text_w)/2:y=1750:enable='between(t,105.5,112.5)'"
          ffmpeg -nostdin -hide_banner -loglevel error -stats -y \
            -i "$QUELLE" -vf "$FILTER" \
            -map 0:v:0 -map 0:a? \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart "$ZIEL"
          test -s "$ZIEL"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$ZIEL" | grep -qx '1080,1920'
          mv "$ZIEL" "$QUELLE"

      - name: Aktualisierten Film veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add film/werbefilm.mp4
          if git diff --cached --quiet; then
            echo "Keine Aenderung an der Videodatei"
            exit 0
          fi
          git commit -m "Werbefilm: Tablet und PC als weitere Geraete einblenden"
          git push
