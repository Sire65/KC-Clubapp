name: KC Werbefilm Installationshinweis

# Nur auf main (Wunsch Hansi 25.10.2026): früher lief der Ablauf auch auf Arbeitszweigen und legte dort einen Film-Commit ab.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/werbefilm-mehrgeraete.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  film-korrigieren:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Club-App auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: FFmpeg sicherstellen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Unveraenderten Originalfilm herunterladen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/Sire65/KC-Infrastructure-Control-Center/main/werbefilm/Koecheclub-Werbefilm.mp4" \
            --output /tmp/kc-film-original.mp4
          test -s /tmp/kc-film-original.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/kc-film-original.mp4)" = "1080,1920"
          D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/kc-film-original.mp4)
          awk -v d="$D" 'BEGIN { exit !(d > 129 && d < 134) }'

      - name: Tablet-PC-Text unten in Installationsszene einblenden
        shell: bash
        run: |
          set -euo pipefail
          # Nur Filmsekunde 105.7 bis 108.15, unten auf der bestehenden Installationsseite.
          # Freiraum ab Y=1265. Installieren-Button (Y=800-990) und Finger bleiben sichtbar.
          # Keine separate Schlusskarte, keine Aenderung an Sprache oder Musik.
          cat > /tmp/geraetehinweis.txt <<'FILTER'
          drawbox=x=270:y=1265:w=540:h=5:color=0xD2A43C@1:t=fill:enable='between(t,105.7,108.15)',
          drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Auch auf Tablet und PC':fontcolor=0x741521:fontsize=62:x=(w-text_w)/2:y=1350:enable='between(t,105.7,108.15)',
          drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='parallel zum Handy installieren':fontcolor=0x741521:fontsize=51:x=(w-text_w)/2:y=1450:enable='between(t,105.7,108.15)'
          FILTER
          ffmpeg -nostdin -hide_banner -loglevel error -stats -y \
            -i /tmp/kc-film-original.mp4 \
            -filter_script:v /tmp/geraetehinweis.txt \
            -map 0:v:0 -map 0:a:0 \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart film/werbefilm-neu.tmp.mp4
          test -s film/werbefilm-neu.tmp.mp4

      - name: Laufzeit und Bildkontrolle
        shell: bash
        run: |
          set -euo pipefail
          D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 film/werbefilm-neu.tmp.mp4)
          awk -v d="$D" 'BEGIN { exit !(d > 129 && d < 134) }'
          for T in 105 106 107 108 110 128; do
            ffmpeg -nostdin -hide_banner -loglevel error -y -ss "$T" \
              -i film/werbefilm-neu.tmp.mp4 -frames:v 1 /tmp/frame-$T.png
            test -s /tmp/frame-$T.png
          done
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 film/werbefilm-neu.tmp.mp4)" = "1080,1920"
          mv film/werbefilm-neu.tmp.mp4 film/werbefilm.mp4
          echo "PASS: $D Sekunden, keine extra Schlusskarte, Hinweis unter Installieren."

      - name: Korrigierten Film veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add film/werbefilm.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Werbefilm: Schlusskarte entfernen, Tablet-PC-Hinweis unter Installieren setzen"
          git push
